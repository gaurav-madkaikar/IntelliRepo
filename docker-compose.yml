name: intellirepo

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: intellirepo
      POSTGRES_PASSWORD: intellirepo
      POSTGRES_USER: intellirepo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellirepo -d intellirepo"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.26-community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/intellirepo-password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    healthcheck:
      test:
        ["CMD-SHELL", "cypher-shell -u neo4j -p intellirepo-password 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  neo4j-data:
  ollama-data:
  postgres-data:
  redis-data:

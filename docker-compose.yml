name: intellirepo

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: intellirepo
      POSTGRES_PASSWORD: intellirepo
      POSTGRES_USER: intellirepo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellirepo -d intellirepo"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
  postgres-data:
  redis-data:
